<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>하나 금융상품 추천</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f8f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-box {
            width: 420px;
            background: white;
            border-radius: 20px;
            padding: 45px 40px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .logo {
            display: block;
            width: 150px;
            max-height: 70px;
            object-fit: contain;
            margin: 0 auto 30px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 26px;
            color: #111;
        }

        .input-box {
            margin-bottom: 16px;
        }

        .input-box label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: bold;
            color: #444;
        }

        .input-box input {
            width: 100%;
            height: 48px;
            padding: 0 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        .input-box input:focus {
            border-color: #009b77;
        }

        .login-button {
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 10px;
            background: #009b77;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .login-button:hover {
            background: #007f63;
        }

        .signup {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: #666;
        }

        .signup a {
            color: #009b77;
            text-decoration: none;
            font-weight: bold;
        }

        .error {
            background: #fff1f1;
            color: #d93025;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 18px;
            text-align: center;
            font-size: 14px;
        }

        .success {
            background: #effaf5;
            color: #00855f;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 18px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="login-box">

    <img
        src="/static/logo.png"
        class="logo"
        alt="Hana Bank"
    >

    <h1>금융상품 추천 서비스</h1>

    {% if error %}
    <div class="error">
        {{ error }}
    </div>
    {% endif %}

    {% if request.query_params.get("signup") == "success" %}
    <div class="success">
        회원가입이 완료되었습니다.<br>
        로그인해주세요.
    </div>
    {% endif %}

    <form action="/login" method="post">

        <div class="input-box">
            <label>아이디</label>

            <input
                type="text"
                name="user_id"
                placeholder="아이디를 입력하세요"
                required
            >
        </div>

        <div class="input-box">
            <label>비밀번호</label>

            <input
                type="password"
                name="password"
                placeholder="비밀번호를 입력하세요"
                required
            >
        </div>

        <button
            type="submit"
            class="login-button"
        >
            로그인
        </button>

    </form>

    <div class="signup">
        계정이 없으신가요?
        <a href="/signup">회원가입</a>
    </div>

</div>

</body>
</html>
